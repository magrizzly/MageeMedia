# =============================================================================
# MageeMedia SnapRAID Configuration (/etc/snapraid.conf)
# Protects /mnt/disk1 and /mnt/disk2 (28 TB usable) using /mnt/parity1 (14 TB)
# =============================================================================

# Parity file location on the dedicated 14 TB Parity drive
parity /mnt/parity1/snapraid.parity

# Content file locations (must have at least Parity + 1 copies across drives)
content /var/snapraid.content
content /mnt/disk1/.snapraid.content
content /mnt/disk2/.snapraid.content

# Data disks in the MergerFS pool
data d1 /mnt/disk1/
data d2 /mnt/disk2/

# Exclude transient torrents, system folders, and temporary files
exclude *.unrecoverable
exclude /tmp/
exclude /lost+found/
exclude /data/torrents/
exclude /temp_vault_staging/
exclude *.!qB
exclude *.part
exclude .DS_Store
exclude Thumbs.db
